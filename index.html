<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQLite View</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("sqlite-view.theme") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --boot-bg: #f8fafc;
        --boot-fg: #0f172a;
        --boot-muted: #2563eb;
        --boot-ring: #dbeafe;
      }

      html.dark {
        --boot-bg: #020817;
        --boot-fg: #e5eefc;
        --boot-muted: #60a5fa;
        --boot-ring: #1e293b;
      }

      html,
      body,
      #root {
        height: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-fg);
      }

      #root:empty {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }

      #root:empty::before {
        content: "SQLite View";
        color: var(--boot-fg);
        font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      #root:empty::after {
        content: "";
        width: 28px;
        height: 28px;
        border: 3px solid var(--boot-ring);
        border-top-color: var(--boot-muted);
        border-radius: 999px;
        animation: sqlite-view-boot-spin 0.8s linear infinite;
      }

      @keyframes sqlite-view-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
